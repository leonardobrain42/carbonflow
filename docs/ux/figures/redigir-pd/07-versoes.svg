c" stroke-width="2"/><rect x="292" y="702" width="225" height="32" rx="6" fill="#10201d" stroke="#35584c"/><text x="404.5" y="723" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e4f2ed" font-weight="600" text-anchor="middle">Manter versão histórica</text><rect x="1140" y="702" width="236" height="32" rx="6" fill="#216c4a" stroke="#75d5a4"/><text x="1258" y="723" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e4f2ed" font-weight="600" text-anchor="middle">Atualizar referência</text><text x="292" y="773" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Congelados não são modificados; a reabertura cria nova versão.</text><text x="26" y="877" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="start">Mockup conceitual · dados ilustrativos · sem promoção normativa ou ação real.</text></svg>