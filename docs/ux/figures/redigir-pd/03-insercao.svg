<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Inserção de insumo"><title>Inserção de insumo</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#75d5a4"/></marker></defs><rect width="1440" height="900" fill="#0b1418"/><text x="26" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="600" text-anchor="start">CarbonFlow  /  Documentos  /  PD</text><text x="26" y="77" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e4f2ed" font-weight="700" text-anchor="start">Inserir insumo no documento</text><text x="26" y="103" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Prévia de inserção · confirmação explícita · versão imutável</text><rect x="1138" y="47" width="125" height="32" rx="6" fill="#10201d" stroke="#35584c"/><text x="1200.5" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e4f2ed" font-weight="600" text-anchor="middle">Prévia</text><rect x="1274" y="47" width="140" height="32" rx="6" fill="#216c4a" stroke="#75d5a4"/><text x="1344" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e4f2ed" font-weight="600" text-anchor="middle">Salvar versão</text><path d="M26 119 L1414 119" fill="none" stroke="#35584c" stroke-width="2"/><rect x="26" y="136" width="230" height="710" rx="8" fill="#142520" stroke="#35584c"/><text x="42" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="700" text-anchor="start">ÍNDICE DO PD</text><text x="48" y="198" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="400" text-anchor="start">Descrição</text><text x="231" y="198" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><text x="48" y="245" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="400" text-anchor="start">Aplicabilidade</text><text x="231" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><rect x="38" y="270" width="206" height="36" rx="6" fill="#204b3a" stroke="#75d5a4"/><text x="48" y="292" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="700" text-anchor="start">Linha de base</text><text x="231" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><text x="48" y="339" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="400" text-anchor="start">Adicionalidade</text><text x="231" y="339" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><text x="48" y="386" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="400" text-anchor="start">Quantificação</text><text x="231" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><text x="48" y="433" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="400" text-anchor="start">Monitoramento</text><text x="231" y="433" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><text x="48" y="480" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="400" text-anchor="start">Salvaguardas</text><text x="231" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><text x="48" y="527" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="400" text-anchor="start">Anexos e referências</text><text x="231" y="527" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><path d="M42 584 L240 584" fill="none" stroke="#35584c" stroke-width="2"/><text x="42" y="611" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="start">Template resolve</text><text x="42" y="631" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="start">ordem e incidência.</text><rect x="270" y="136" width="1144" height="710" rx="8" fill="#142520" stroke="#35584c"/><text x="292" y="175" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#e4f2ed" font-weight="700" text-anchor="start">Selecionar formato e conferir referência</text><rect x="292" y="201" width="1100" height="115" rx="8" fill="#10201d" stroke="#35584c"/><text x="306" y="228" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4f2ed" font-weight="700" text-anchor="start">Carregador 1 · revisão 1</text><text x="306" y="254" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Potência declarada: 50 kW · DCFC · fonte: inventário do projeto.</text><text x="306" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Não demonstra instalação, comissionamento ou inclusão na fronteira.</text><text x="306" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e6bd75" font-weight="600" text-anchor="start">Evidência de instalação pendente</text><rect x="292" y="333" width="355" height="108" rx="8" fill="#10201d" stroke="#35584c"/><text x="306" y="360" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4f2ed" font-weight="700" text-anchor="start">Referência inline</text><text x="306" y="386" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Vincular fonte e locator ao trecho.</text><rect x="659" y="333" width="355" height="108" rx="8" fill="#10201d" stroke="#35584c"/><text x="673" y="360" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4f2ed" font-weight="700" text-anchor="start">Bloco factual</text><text x="673" y="386" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Dados derivados somente leitura.</text><rect x="1026" y="333" width="355" height="108" rx="8" fill="#10201d" stroke="#35584c"/><text x="1040" y="360" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4f2ed" font-weight="700" text-anchor="start">Tabela / figura</text><text x="1040" y="386" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Apenas se dados e render autorizados.</text><rect x="292" y="460" width="1100" height="245" rx="8" fill="#10201d" stroke="#35584c"/><text x="308" y="490" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e4f2ed" font-weight="700" text-anchor="start">Prévia do bloco factual</text><text x="308" y="528" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e4f2ed" font-weight="400" text-anchor="start">Carregador 1 — potência nominal declarada de 50 kW.</text><text x="308" y="565" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Fonte: inventário de carregadores, revisão 1.</text><text x="308" y="598" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e6bd75" font-weight="400" text-anchor="start">Natureza: declaração; evidência pendente; revisão a confirmar.</text><text x="308" y="642" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Referência não será atualizada silenciosamente após salvar.</text><rect x="1040" y="662" width="155" height="32" rx="6" fill="#10201d" stroke="#35584c"/><text x="1117.5" y="683" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e4f2ed" font-weight="600" text-anchor="middle">Cancelar</text><rect x="1205" y="662" width="170" height="32" rx="6" fill="#216c4a" stroke="#75d5a4"/><text x="1290" y="683" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e4f2ed" font-weight="600" text-anchor="middle">Inserir bloco</text><text x="292" y="769" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">A permissão e a versão são conferidas novamente no servidor.</text><text x="26" y="877" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="start">Mockup conceitual · dados ilustrativos · sem promoção normativa ou ação real.</text></svg>