serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><path d="M42 584 L240 584" fill="none" stroke="#35584c" stroke-width="2"/><text x="42" y="611" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="start">Template resolve</text><text x="42" y="631" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="start">ordem e incidência.</text><rect x="270" y="136" width="1144" height="710" rx="8" fill="#142520" stroke="#35584c"/><rect x="292" y="159" width="676" height="650" rx="8" fill="#182c25" stroke="#35584c"/><text x="316" y="195" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#e4f2ed" font-weight="700" text-anchor="start">PD · Linha de base</text><text x="316" y="222" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e6bd75" font-weight="400" text-anchor="start">Prévia interna · fundamentação pendente</text><path d="M316 241 L944 241" fill="none" stroke="#35584c" stroke-width="2"/><text x="316" y="278" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e4f2ed" font-weight="700" text-anchor="start">1. Cenário de referência</text><text x="316" y="308" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e4f2ed" font-weight="400" text-anchor="start">Narrativa técnica e referências versionadas.</text><text x="316" y="344" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e4f2ed" font-weight="700" text-anchor="start">2. Parâmetros e fontes</text><rect x="316" y="362" width="628" height="115" rx="8" fill="#10201d" stroke="#35584c"/><text x="330" y="389" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e4f2ed" font-weight="400" text-anchor="start">EVR / ratings — referência a resolver</text><text x="330" y="423" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e4f2ed" font-weight="400" text-anchor="start">EFfuel / IR — avaliação pendente</text><text x="330" y="457" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e6bd75" font-weight="400" text-anchor="start">Nenhum resultado inventado</text><text x="316" y="514" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e4f2ed" font-weight="700" text-anchor="start">3. Justificativas e limitações</text><text x="316" y="546" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Alegações com links de proveniência e ressalvas.</text><text x="316" y="745" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="start">Índice ilustrativo; template real determina seções.</text><rect x="982" y="159" width="410" height="130" rx="8" fill="#10201d" stroke="#35584c"/><text x="996" y="186" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4f2ed" font-weight="700" text-anchor="start">Estado editorial</text><text x="996" y="212" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Rascunho · revisão pendente</text><text x="996" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Referências e provas a conferir</text><rect x="982" y="303" width="410" height="155" rx="8" fill="#10201d" stroke="#35584c"/><text x="996" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4f2ed" font-weight="700" text-anchor="start">Achados críticos</text><text x="996" y="356" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Fonte / regra / alegação</text><text x="996" y="378" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Abrir origem e resolver antes do release.</text><text x="996" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e6bd75" font-weight="600" text-anchor="start">Não pronto</text><rect x="982" y="472" width="410" height="126" rx="8" fill="#10201d" stroke="#35584c"/><text x="996" y="499" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4f2ed" font-weight="700" text-anchor="start">Variante do documento</text><text x="996" y="525" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Reservada / pública conforme acesso</text><text x="996" y="547" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Redaction e licença no compositor</text><rect x="982" y="620" width="198" height="32" rx="6" fill="#10201d" stroke="#35584c"/><text x="1081" y="641" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e4f2ed" font-weight="600" text-anchor="middle">Ver histórico</text><rect x="1190" y="620" width="202" height="32" rx="6" fill="#216c4a" stroke="#75d5a4"/><text x="1291" y="641" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e4f2ed" font-weight="600" text-anchor="middle">Revisar seção</text><text x="982" y="708" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">PT-25: revisão por versão</text><text x="982" y="734" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">PT-26: DOCX/PDF/manifesto</text><text x="26" y="877" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="start">Mockup conceitual · dados ilustrativos · sem promoção normativa ou ação real.</text></svg>