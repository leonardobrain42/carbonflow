<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Consistência"><title>Consistência</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#75d5a4"/></marker></defs><rect width="1440" height="900" fill="#0b1418"/><text x="26" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="600" text-anchor="start">CarbonFlow  /  Documentos  /  PD</text><text x="26" y="77" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e4f2ed" font-weight="700" text-anchor="start">Verificar consistência</text><text x="26" y="103" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Achados e checks por finalidade · exemplos ilustrativos</text><rect x="1138" y="47" width="125" height="32" rx="6" fill="#10201d" stroke="#35584c"/><text x="1200.5" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e4f2ed" font-weight="600" text-anchor="middle">Prévia</text><rect x="1274" y="47" width="140" height="32" rx="6" fill="#216c4a" stroke="#75d5a4"/><text x="1344" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e4f2ed" font-weight="600" text-anchor="middle">Salvar versão</text><path d="M26 119 L1414 119" fill="none" stroke="#35584c" stroke-width="2"/><rect x="26" y="136" width="230" height="710" rx="8" fill="#142520" stroke="#35584c"/><text x="42" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="700" text-anchor="start">ÍNDICE DO PD</text><text x="48" y="198" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="400" text-anchor="start">Descrição</text><text x="231" y="198" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><text x="48" y="245" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="400" text-anchor="start">Aplicabilidade</text><text x="231" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><rect x="38" y="270" width="206" height="36" rx="6" fill="#204b3a" stroke="#75d5a4"/><text x="48" y="292" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="700" text-anchor="start">Linha de base</text><text x="231" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><text x="48" y="339" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="400" text-anchor="start">Adicionalidade</text><text x="231" y="339" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><text x="48" y="386" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="400" text-anchor="start">Quantificação</text><text x="231" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><text x="48" y="433" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="400" text-anchor="start">Monitoramento</text><text x="231" y="433" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><text x="48" y="480" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="400" text-anchor="start">Salvaguardas</text><text x="231" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><text x="48" y="527" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="400" text-anchor="start">Anexos e referências</text><text x="231" y="527" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="end">○</text><path d="M42 584 L240 584" fill="none" stroke="#35584c" stroke-width="2"/><text x="42" y="611" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="start">Template resolve</text><text x="42" y="631" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="start">ordem e incidência.</text><rect x="270" y="136" width="1144" height="710" rx="8" fill="#142520" stroke="#35584c"/><text x="292" y="172" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#e4f2ed" font-weight="700" text-anchor="start">Pendências e divergências</text><text x="292" y="201" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Não executado, pendente de prova e conflito são estados diferentes.</text><rect x="292" y="230" width="1100" height="99" rx="8" fill="#10201d" stroke="#35584c"/><text x="308" y="257" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e4f2ed" font-weight="700" text-anchor="start">Quantificação</text><text x="308" y="282" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Valor narrado deve coincidir com run, unidade e precisão.</text><text x="308" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e6bd75" font-weight="400" text-anchor="start">Checagem pendente</text><rect x="1166" y="264" width="208" height="32" rx="6" fill="#10201d" stroke="#35584c"/><text x="1270" y="285" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e4f2ed" font-weight="600" text-anchor="middle">Resolver na origem</text><rect x="292" y="340" width="1100" height="99" rx="8" fill="#10201d" stroke="#35584c"/><text x="308" y="367" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e4f2ed" font-weight="700" text-anchor="start">Aplicabilidade</text><text x="308" y="392" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Série oficial de vendas não vinculada ao teste.</text><text x="308" y="417" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e6bd75" font-weight="400" text-anchor="start">Prova pendente</text><rect x="1166" y="374" width="208" height="32" rx="6" fill="#10201d" stroke="#35584c"/><text x="1270" y="395" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e4f2ed" font-weight="600" text-anchor="middle">Resolver na origem</text><rect x="292" y="450" width="1100" height="99" rx="8" fill="#10201d" stroke="#35584c"/><text x="308" y="477" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e4f2ed" font-weight="700" text-anchor="start">Fronteira</text><text x="308" y="502" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Potência cadastrada não demonstra comissionamento.</text><text x="308" y="527" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e6bd75" font-weight="400" text-anchor="start">Avaliar suporte</text><rect x="1166" y="484" width="208" height="32" rx="6" fill="#10201d" stroke="#35584c"/><text x="1270" y="505" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e4f2ed" font-weight="600" text-anchor="middle">Resolver na origem</text><rect x="292" y="560" width="1100" height="99" rx="8" fill="#10201d" stroke="#35584c"/><text x="308" y="587" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e4f2ed" font-weight="700" text-anchor="start">Cronologia</text><text x="308" y="612" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Data prevista não prova evento efetivo.</text><text x="308" y="637" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e6bd75" font-weight="400" text-anchor="start">Revisão humana</text><rect x="1166" y="594" width="208" height="32" rx="6" fill="#10201d" stroke="#35584c"/><text x="1270" y="615" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e4f2ed" font-weight="600" text-anchor="middle">Resolver na origem</text><rect x="292" y="670" width="1100" height="99" rx="8" fill="#10201d" stroke="#35584c"/><text x="308" y="697" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e4f2ed" font-weight="700" text-anchor="start">Referências</text><text x="308" y="722" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Mudança de fonte exige rechecagem seletiva.</text><text x="308" y="747" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e6bd75" font-weight="400" text-anchor="start">Consultar versão</text><rect x="1166" y="704" width="208" height="32" rx="6" fill="#10201d" stroke="#35584c"/><text x="1270" y="725" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e4f2ed" font-weight="600" text-anchor="middle">Resolver na origem</text><text x="292" y="810" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Um achado por requisito e objeto, com âncoras nas seções afetadas.</text><text x="26" y="877" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="400" text-anchor="start">Mockup conceitual · dados ilustrativos · sem promoção normativa ou ação real.</text></svg>