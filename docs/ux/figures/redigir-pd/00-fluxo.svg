<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-label="Fluxo de autoria"><title>Fluxo de autoria</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#75d5a4"/></marker></defs><rect width="1200" height="730" fill="#0b1418"/><text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#e4f2ed" font-weight="700" text-anchor="start">Da preparação técnica à autoria fundamentada</text><text x="40" y="78" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b5cfc3" font-weight="400" text-anchor="start">Uma origem canônica por fato · biblioteca contextual e suporte versionado</text><rect x="38" y="110" width="278" height="68" rx="8" fill="#142520" stroke="#35584c"/><text x="177" y="151" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e4f2ed" font-weight="700" text-anchor="middle">Normas e licenças</text><path d="M177 178 L177 208" fill="none" stroke="#35584c" stroke-width="2"/><rect x="332" y="110" width="278" height="68" rx="8" fill="#142520" stroke="#35584c"/><text x="471" y="151" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e4f2ed" font-weight="700" text-anchor="middle">Fatos e evidências</text><path d="M471 178 L471 208" fill="none" stroke="#35584c" stroke-width="2"/><rect x="626" y="110" width="278" height="68" rx="8" fill="#142520" stroke="#35584c"/><text x="765" y="151" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e4f2ed" font-weight="700" text-anchor="middle">Cálculos e monitoramento</text><path d="M765 178 L765 208" fill="none" stroke="#35584c" stroke-width="2"/><rect x="920" y="110" width="278" height="68" rx="8" fill="#142520" stroke="#35584c"/><text x="1059" y="151" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e4f2ed" font-weight="700" text-anchor="middle">Decisões e salvaguardas</text><path d="M1059 178 L1059 208" fill="none" stroke="#35584c" stroke-width="2"/><path d="M177 208 L1059 208" fill="none" stroke="#35584c" stroke-width="2"/><path d="M600 208 L600 231" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><rect x="245" y="232" width="710" height="85" rx="8" fill="#142520" stroke="#35584c"/><text x="600" y="263" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e4f2ed" font-weight="700" text-anchor="middle">Resolvedor de contexto / mapping</text><text x="600" y="290" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="middle">Método, edição, ato, seção, versões e permissões</text><path d="M600 317 L600 340" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><rect x="245" y="340" width="710" height="85" rx="8" fill="#142520" stroke="#35584c"/><text x="600" y="371" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e4f2ed" font-weight="700" text-anchor="middle">Biblioteca de insumos</text><text x="600" y="398" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="middle">Consulta ACL-first, seleção exata, referências e figuras</text><path d="M600 425 L600 448" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><rect x="245" y="448" width="710" height="85" rx="8" fill="#18382c" stroke="#75d5a4"/><text x="600" y="479" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e4f2ed" font-weight="700" text-anchor="middle">Editor híbrido + ClaimSupport</text><text x="600" y="506" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="middle">Autoria manual; IA opcional; confirmação e checks</text><path d="M600 533 L600 556" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><rect x="245" y="556" width="710" height="85" rx="8" fill="#142520" stroke="#35584c"/><text x="600" y="587" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e4f2ed" font-weight="700" text-anchor="middle">Revisão e manifesto</text><text x="600" y="614" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="middle">Parecer competente, snapshots, DOCX/PDF e anexos</text><text x="40" y="700" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b5cfc3" font-weight="400" text-anchor="start">Nenhuma consulta, inserção ou sugestão IA equivale a prova aceita ou validação externa.</text></svg>