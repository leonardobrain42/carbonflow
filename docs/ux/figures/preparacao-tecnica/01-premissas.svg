="middle">1. Cenário</text><rect x="429" y="107" width="190" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="524" y="132" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">2. EVR e comparáveis</text><rect x="628" y="107" width="155" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="705.5" y="132" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">3. Fatores e E8</text><rect x="792" y="107" width="135" height="40" rx="8" fill="#204b3a" stroke="#75d5a4"/><text x="859.5" y="132" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">4. Premissas</text><rect x="936" y="107" width="115" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="993.5" y="132" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">5. Revisão</text><rect x="1060" y="107" width="155" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="1137.5" y="132" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">6. Vínculo ao PD</text><text x="310" y="183" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Premissas e planejamento de atualização</text><text x="310" y="208" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Registre o cenário e as hipóteses; confirme fontes e responsáveis do plano anual.</text><rect x="310" y="226" width="1085" height="102" rx="9" fill="#10201d" stroke="#35584c"/><text x="328" y="252" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">Premissas do cenário · guia tipado</text><text x="328" y="278" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Alternativa ao projeto: não informada   •   Classe: LDV candidata   •   Ano da eficiência: a definir</text><text x="328" y="304" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Consumo candidato e unidade: hipótese opcional, não AFEC/MPG selecionado.</text><rect x="1153" y="242" width="222" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1264" y="265" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Editar premissas</text><text x="310" y="360" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Plano ex ante · atualização anual específica (IR)</text><text x="310" y="385" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Sugestões de fontes e passos a confirmar. Responsáveis ainda não designados.</text><rect x="310" y="402" width="537" height="128" rx="9" fill="#10201d" stroke="#35584c"/><text x="326" y="428" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">EVR · Senatran / RENAVAM</text><text x="326" y="452" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Fonte candidata · frequência anual</text><text x="326" y="475" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Reconciliar estoque, aliases e cobertura</text><text x="326" y="501" fill="#e6bd75" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">Responsável: não designado</text><rect x="701" y="484" width="128" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="765" y="507" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle"