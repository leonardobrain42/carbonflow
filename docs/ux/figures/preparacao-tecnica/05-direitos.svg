<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Direitos e divulgação"><title>Direitos e divulgação</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#75d5a4"/></marker></defs><rect width="1440" height="900" fill="#0b1418"/><rect x="18" y="18" width="246" height="864" rx="9" fill="#10201d" stroke="#35584c"/><rect x="284" y="18" width="1138" height="864" rx="9" fill="#122421" stroke="#35584c"/><text x="38" y="52" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">COMEÇAR</text><text x="43" y="81" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Painel de trabalho</text><text x="43" y="124" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Preparar informações</text><text x="38" y="179" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">APLICABILIDADE</text><text x="43" y="208" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Situação do projeto</text><text x="43" y="251" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Acesso à rede</text><text x="43" y="294" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Direitos do projeto</text><text x="43" y="337" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Estações e fronteira</text><text x="38" y="392" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">FUNDAMENTAÇÃO</text><text x="43" y="421" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Linha de base</text><rect x="32" y="442" width="218" height="37" rx="8" fill="#204b3a" stroke="#75d5a4"/><rect x="32" y="442" width="4" height="37" rx="2" fill="#75d5a4"/><text x="43" y="464" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Adicionalidade</text><text x="43" y="507" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Guias técnicos</text><text x="38" y="562" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">MEDIÇÃO</text><text x="43" y="591" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Monitorar energia</text><text x="43" y="634" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Quantificação</text><text x="38" y="689" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">DOCUMENTAÇÃO</text><text x="43" y="718" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Redigir</text><text x="43" y="761" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Revisar</text><text x="310" y="58" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">Adicionalidade</text><text x="310" y="85" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">VM0038 v1.1 · OPEN BR · PD ex ante · proposta visual, sem aprovação</text><rect x="310" y="107" width="170" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="395" y="132" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">1. Enquadramento</text><rect x="489" y="107" width="145" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="561.5" y="132" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">2. Cronologia</text><rect x="643" y="107" width="115" height="40" rx="8" fill="#204b3a" stroke="#75d5a4"/><text x="700.5" y="132" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">3. Direitos</text><rect x="767" y="107" width="115" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="824.5" y="132" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">4. Revisão</text><rect x="891" y="107" width="155" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="968.5" y="132" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">5. Vínculo ao PD</text><text x="310" y="183" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Direitos sobre as reduções</text><text x="310" y="208" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Consulta ao módulo Direitos do projeto · declarações não equivalem a titularidade comprovada.</text><rect x="310" y="226" width="1085" height="110" rx="9" fill="#10201d" stroke="#35584c"/><text x="328" y="251" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">Titular declarado · Brainstorm</text><text x="328" y="275" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Nome informado; pessoa/organização e representação ainda não comprovadas.</text><text x="328" y="298" fill="#e6bd75" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">Vínculo canônico pendente</text><rect x="1153" y="252" width="222" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1264" y="275" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Vincular titular</text><rect x="310" y="347" width="1085" height="110" rx="9" fill="#10201d" stroke="#35584c"/><text x="328" y="372" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">Instrumento jurídico · ref. 123456</text><text x="328" y="396" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Referência textual não substitui contrato, partes, escopo, vigência e cláusula.</text><text x="328" y="419" fill="#e6bd75" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">Prova documental pendente</text><rect x="1153" y="373" width="222" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1264" y="396" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Vincular instrumento</text><rect x="310" y="468" width="1085" height="110" rx="9" fill="#10201d" stroke="#35584c"/><text x="328" y="493" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">Divulgação aos motoristas · no carregador</text><text x="328" y="517" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Data declarada 11/12/2026 é futura no corte de 26/11/2026; ref. 123 sem prova.</text><text x="328" y="540" fill="#e6bd75" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">Planejada / a reconciliar</text><rect x="1153" y="494" width="222" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1264" y="517" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Registrar divulgação</text><rect x="310" y="589" width="1085" height="110" rx="9" fill="#10201d" stroke="#35584c"/><text x="328" y="614" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">Dupla reivindicação</text><text x="328" y="638" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Sem sobreposição declarada; falta análise de evidências e conflitos.</text><text x="328" y="661" fill="#e6bd75" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">Aguardando avaliação</text><rect x="1153" y="615" width="222" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1264" y="638" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Consultar análise</text><rect x="310" y="711" width="1085" height="87" rx="9" fill="#182c24" stroke="#35584c"/><text x="328" y="739" fill="#75d5a4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Fonte única: Direitos do projeto</text><text x="328" y="765" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Não criar PP, poderes ou grants por declaração. Usar partes/contratos/eventos/arquivos existentes.</text><rect x="310" y="828" width="165" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="392.5" y="851" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Atualizar dados</text><rect x="486" y="828" width="94" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="533" y="851" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Voltar</text><rect x="1170" y="828" width="225" height="36" rx="7" fill="#216c4a" stroke="#75d5a4"/><text x="1282.5" y="851" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Próxima etapa</text></svg>