lvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Linha de base</text><rect x="32" y="442" width="218" height="37" rx="8" fill="#204b3a" stroke="#75d5a4"/><rect x="32" y="442" width="4" height="37" rx="2" fill="#75d5a4"/><text x="43" y="464" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Adicionalidade</text><text x="43" y="507" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Guias técnicos</text><text x="38" y="562" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">MEDIÇÃO</text><text x="43" y="591" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Monitorar energia</text><text x="43" y="634" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Quantificação</text><text x="38" y="689" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">DOCUMENTAÇÃO</text><text x="43" y="718" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Redigir</text><text x="43" y="761" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Revisar</text><text x="310" y="58" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">Adicionalidade</text><text x="310" y="85" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">VM0038 v1.1 · OPEN BR · PD ex ante · proposta visual, sem aprovação</text><rect x="310" y="107" width="170" height="40" rx="8" fill="#204b3a" stroke="#75d5a4"/><text x="395" y="132" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. Enquadramento</text><rect x="489" y="107" width="145" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="561.5" y="132" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">2. Cronologia</text><rect x="643" y="107" width="115" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="700.5" y="132" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">3. Direitos</text><rect x="767" y="107" width="115" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="824.5" y="132" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">4. Revisão</text><rect x="891" y="107" width="155" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="968.5" y="132" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">5. Vínculo ao PD</text><text x="310" y="183" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Enquadramento e rota candidata</text><text x="310" y="208" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">A seleção contextual orienta a avaliação; não comprova adicionalidade.</text><rect x="310" y="226" width="1085" height="150" rx="9" fill="#18382c" stroke="#75d5a4"/><text x="328" y="253" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">VMD0049 v1.1 · lista positiva candidata</text><text x="328" y="283" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Correspondência preliminar: Brasil · LDV · DCFC · tabela da edição registrada.</text><text x="328" y="312" fill="#e6bd75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="start">Condições e fonte normativa: aguardando avaliação contextual.</text><rect x="1153" y="264" width="222" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1264" y="287" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Consultar regra</text><text x="328" y="345" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">O teste de mercado VM0038 §4 é uma dependência de aplicabilidade, não outro parecer.</text><rect x="310" y="390" width="1085" height="190" rx="9" fill="#10201d" stroke="#35584c"/><text x="328" y="419" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Excedente regulatório</text><text x="328" y="446" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Verificar obrigações incidentes pela atividade, território e vigência.</text><text x="328" y="476" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Federal</text><text x="910" y="476" fill="#e6bd75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Avaliação pendente</text><text x="328" y="505" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Distrital / estadual</text><text x="910" y="505" fill="#e6bd75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Avaliação pendente</text><text x="328" y="534" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Municipal, se incidente</text><text x="910" y="534" fill="#e6bd75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Avaliação pendente</text><rect x="1153" y="468" width="222" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1264" y="491" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Solicitar avaliação</text><rect x="310" y="595" width="1085" height="91" rx="9" fill="#10201d" stroke="#35584c"/><text x="328" y="620" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">Rota alternativa · VT0008</text><text x="328" y="644" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Avaliação por projeto, apenas quando incidente e suportada.</text><text x="328" y="667" fill="#e6bd75" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">Implementação prevista em #103</text><rect x="1153" y="621" width="222" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1264" y="644" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Ver limitações</text><rect x="310" y="698" width="1085" height="91" rx="9" fill="#10201d" stroke="#35584c"/><text x="328" y="723" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">Pareceres internos</text><text x="328" y="747" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Lista positiva, excedente regulatório e cronologia · V100.</text><text x="328" y="770" fill="#e6bd75" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">Aguardando parecer competente</text><rect x="1153" y="724" width="222" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1264" y="747" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Ver revisão</text><rect x="310" y="828" width="165" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="392.5" y="851" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Atualizar dados</text><rect x="486" y="828" width="94" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="533" y="851" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Voltar</text><rect x="1170" y="828" width="225" height="36" rx="7" fill="#216c4a" stroke="#75d5a4"/><text x="1282.5" y="851" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Próxima etapa</text></svg>