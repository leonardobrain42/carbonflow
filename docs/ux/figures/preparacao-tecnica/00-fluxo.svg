<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Diagrama de preparação técnica"><title>Diagrama de preparação técnica</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#75d5a4"/></marker></defs><rect width="1200" height="760" fill="#0b1418"/><text x="36" y="50" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">Preparação técnica · da premissa ao documento</text><text x="36" y="78" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Diagrama de responsabilidades · nenhuma etapa equivale a aprovação normativa</text><rect x="230" y="107" width="740" height="78" rx="9" fill="#122421" stroke="#35584c"/><text x="600" y="137" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Contextualizar</text><text x="600" y="162" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Método, edição, jurisdição e finalidade</text><path d="M600 185 V207" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><rect x="230" y="207" width="740" height="78" rx="9" fill="#122421" stroke="#35584c"/><text x="600" y="237" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Resolver fontes e regras</text><text x="600" y="262" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Catálogos e referências autorizadas</text><path d="M600 285 V307" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><rect x="230" y="307" width="740" height="78" rx="9" fill="#122421" stroke="#35584c"/><text x="600" y="337" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Coletar e vincular</text><text x="600" y="362" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Premissas, fatos, eventos e provas</text><path d="M600 385 V407" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><rect x="230" y="407" width="740" height="78" rx="9" fill="#122421" stroke="#35584c"/><text x="600" y="437" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Revisar por critério</text><text x="600" y="462" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Decisão humana, versão e ressalvas</text><path d="M600 485 V507" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><rect x="230" y="507" width="740" height="78" rx="9" fill="#18382c" stroke="#75d5a4"/><text x="600" y="537" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Compor PD</text><text x="600" y="562" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Blocos derivados, narrativa e proveniência</text><path d="M600 585 V607" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><rect x="230" y="607" width="740" height="78" rx="9" fill="#122421" stroke="#35584c"/><text x="600" y="637" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Revisão editorial</text><text x="600" y="662" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Congelamento e exportação autorizados</text><rect x="25" y="335" width="184" height="105" rx="9" fill="#10201d" stroke="#35584c"/><text x="117" y="366" fill="#75d5a4" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Rechecagem</text><text x="117" y="389" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Alteração relevante</text><text x="117" y="411" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle">ou devolução</text><path d="M230 446 H117 V285 H230" stroke="#75d5a4" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="991" y="335" width="184" height="105" rx="9" fill="#10201d" stroke="#35584c"/><text x="1083" y="366" fill="#75d5a4" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">MR posterior</text><text x="1083" y="390" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Dados efetivos</text><text x="1083" y="412" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle">e guardas próprias</text><path d="M970 346 H991" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><text x="36" y="730" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">PD ex ante e MR são finalidades distintas. Direitos, evidências e revisão preservam seus owners.</text></svg>