<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Diagrama elétrico simplificado"><title>Diagrama elétrico simplificado</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#75d5a4"/></marker></defs><rect width="1200" height="750" fill="#0b1418"/><text x="40" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e4f2ed" font-weight="700" text-anchor="start">Fronteira elétrica · GRID_ONLY</text><text x="40" y="75" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b5cfc3" font-weight="400" text-anchor="start">Diagrama conceitual, não projeto elétrico nem comprovação da instalação</text><rect x="270" y="110" width="660" height="90" rx="9" fill="#122421" stroke="#35584c"/><text x="600" y="143" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e4f2ed" font-weight="700" text-anchor="middle">Rede elétrica · SIN</text><text x="600" y="171" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b5cfc3" font-weight="400" text-anchor="middle">Origem da eletricidade</text><path d="M600 200 L600 222" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><rect x="270" y="222" width="660" height="90" rx="9" fill="#18382c" stroke="#75d5a4"/><text x="600" y="255" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e4f2ed" font-weight="700" text-anchor="middle">EC · montante</text><text x="600" y="283" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b5cfc3" font-weight="400" text-anchor="middle">Energia consumida pela infraestrutura</text><path d="M600 312 L600 334" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><rect x="270" y="334" width="660" height="90" rx="9" fill="#122421" stroke="#35584c"/><text x="600" y="367" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e4f2ed" font-weight="700" text-anchor="middle">Carregador DCFC</text><text x="600" y="395" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b5cfc3" font-weight="400" text-anchor="middle">Conversão, perdas e consumo auxiliar conforme fronteira</text><path d="M600 424 L600 446" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><rect x="270" y="446" width="660" height="90" rx="9" fill="#18382c" stroke="#75d5a4"/><text x="600" y="479" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e4f2ed" font-weight="700" text-anchor="middle">ED · jusante</text><text x="600" y="507" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b5cfc3" font-weight="400" text-anchor="middle">Energia entregue aos veículos</text><path d="M600 536 L600 558" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><rect x="270" y="558" width="660" height="90" rx="9" fill="#122421" stroke="#35584c"/><text x="600" y="591" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e4f2ed" font-weight="700" text-anchor="middle">Veículos BEV</text><text x="600" y="619" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b5cfc3" font-weight="400" text-anchor="middle">Recarga efetiva elegível</text><text x="40" y="700" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b5cfc3" font-weight="400" text-anchor="start">EC derivada somente se a rota metodológica e o owner a suportarem, com provas e revisão.</text><text x="40" y="727" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b5cfc3" font-weight="400" text-anchor="start">Instrumentos e intervalos devem corresponder à instalação efetiva; ausência não vira zero.</text></svg>