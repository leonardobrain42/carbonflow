issionamento</text><text x="378" y="348" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e6bd75" font-weight="400" text-anchor="start">Pendente · vincular PDF à revisão do ativo</text><rect x="1120" y="320" width="205" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1222.5" y="343" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Vincular prova</text><rect x="360" y="405" width="985" height="123" rx="9" fill="#10201d" stroke="#35584c"/><text x="378" y="434" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e4f2ed" font-weight="700" text-anchor="start">Medidor ED</text><text x="378" y="460" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Energia entregue · jusante</text><text x="378" y="490" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e6bd75" font-weight="400" text-anchor="start">Não cadastrado · calibração não comprovada</text><rect x="1120" y="448" width="205" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1222.5" y="471" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Configurar medição</text><rect x="360" y="543" width="985" height="123" rx="9" fill="#10201d" stroke="#35584c"/><text x="378" y="572" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e4f2ed" font-weight="700" text-anchor="start">Medidor EC</text><text x="378" y="598" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Energia consumida · montante (ou rota suportada)</text><text x="378" y="628" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e6bd75" font-weight="400" text-anchor="start">Não cadastrado · calibração não comprovada</text><rect x="1120" y="586" width="205" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1222.5" y="609" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Configurar medição</text><text x="310" y="782" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Carregador da captura; nenhuma medição ou admissão inferida.</text><rect x="310" y="825" width="170" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="395" y="848" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Atualizar dados</text><rect x="492" y="825" width="95" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="539.5" y="848" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Voltar</text><rect x="1170" y="825" width="225" height="36" rx="7" fill="#216c4a" stroke="#75d5a4"/><text x="1282.5" y="848" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Próxima etapa</text></svg>