<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Fluxo de módulos canônicos"><title>Fluxo de módulos canônicos</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#75d5a4"/></marker></defs><rect width="1200" height="700" fill="#0b1418"/><text x="35" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#e4f2ed" font-weight="700" text-anchor="start">Uma jornada, múltiplos módulos canônicos</text><text x="35" y="78" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b5cfc3" font-weight="400" text-anchor="start">J02–J07 · atividades independentes podem avançar em paralelo</text><rect x="35" y="120" width="355" height="105" rx="9" fill="#122421" stroke="#35584c"/><text x="51" y="155" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e4f2ed" font-weight="700" text-anchor="start">J02 · Estruturação</text><text x="51" y="188" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Fronteira, ativos, direitos e eventos</text><rect x="422" y="120" width="355" height="105" rx="9" fill="#122421" stroke="#35584c"/><text x="438" y="155" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e4f2ed" font-weight="700" text-anchor="start">J03 · Fundamentação</text><text x="438" y="188" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Aplicabilidade, baseline, adicionalidade</text><rect x="809" y="120" width="355" height="105" rx="9" fill="#122421" stroke="#35584c"/><text x="825" y="155" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e4f2ed" font-weight="700" text-anchor="start">J04 · Integridade</text><text x="825" y="188" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Riscos, stakeholders, ODS</text><rect x="35" y="290" width="355" height="105" rx="9" fill="#122421" stroke="#35584c"/><text x="51" y="325" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e4f2ed" font-weight="700" text-anchor="start">J05 · Plano operacional</text><text x="51" y="358" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Instrumentos, coleta, QA e contingência</text><rect x="422" y="290" width="355" height="105" rx="9" fill="#122421" stroke="#35584c"/><text x="438" y="325" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e4f2ed" font-weight="700" text-anchor="start">Quantificação ex ante</text><text x="438" y="358" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Premissas e referências, se suportado</text><rect x="809" y="290" width="355" height="105" rx="9" fill="#122421" stroke="#35584c"/><text x="825" y="325" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e4f2ed" font-weight="700" text-anchor="start">J06 · Documentação</text><text x="825" y="358" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">PD, anexos, revisão e versões</text><rect x="35" y="475" width="355" height="105" rx="9" fill="#122421" stroke="#35584c"/><text x="51" y="510" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e4f2ed" font-weight="700" text-anchor="start">J07 · Monitoramento</text><text x="51" y="543" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Leituras, QA, períodos e MR</text><rect x="422" y="475" width="355" height="105" rx="9" fill="#122421" stroke="#35584c"/><text x="438" y="510" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e4f2ed" font-weight="700" text-anchor="start">Quantificação monitorada</text><text x="438" y="543" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">Entradas efetivas, E8 e memória</text><rect x="809" y="475" width="355" height="105" rx="9" fill="#122421" stroke="#35584c"/><text x="825" y="510" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e4f2ed" font-weight="700" text-anchor="start">J07 · Dossiês e atos</text><text x="825" y="543" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b5cfc3" font-weight="400" text-anchor="start">MR e atos externos comprovados</text><path d="M390 172 L422 172" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><path d="M599 225 L599 290" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><path d="M777 343 L809 343" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><path d="M986 225 L986 290" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><path d="M212 225 L212 290" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><path d="M390 343 L422 343" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><path d="M212 395 L212 475" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><path d="M390 527 L422 527" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><path d="M777 527 L809 527" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#a)"/><text x="35" y="638" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#75d5a4" font-weight="600" text-anchor="start">Guias técnicos: orientação, histórico e reconciliação. Edição única nos módulos owners.</text><text x="35" y="666" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b5cfc3" font-weight="400" text-anchor="start">PD ex ante não exige MR futuro. O monitorado mantém seus próprios gates e provas.</text></svg>