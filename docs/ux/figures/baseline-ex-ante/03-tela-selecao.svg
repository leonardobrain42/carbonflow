7.5" y="136" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">1. Cenário</text><rect x="434" y="111" width="195" height="40" rx="8" fill="#204b3a" stroke="#75d5a4"/><text x="531.5" y="136" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. EVR e comparáveis</text><rect x="638" y="111" width="155" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="715.5" y="136" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">3. Fatores e E8</text><rect x="802" y="111" width="132" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="868" y="136" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">4. Premissas</text><rect x="943" y="111" width="115" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="1000.5" y="136" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">5. Revisão</text><rect x="1067" y="111" width="155" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="1144.5" y="136" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">6. Vínculo ao PD</text><text x="310" y="186" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Composição da frota de referência</text><text x="310" y="210" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Escolha uma versão compatível com o contexto. Vínculo não representa admissão.</text><rect x="310" y="222" width="1085" height="75" rx="12" fill="#10201d" stroke="#35584c"/><text x="328" y="247" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Contexto: Brasil · Rede aberta · LDV BEV · DCFC / SIN</text><text x="328" y="274" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Ano de observação ilustrativo: 2026 · ciclo urbano · finalidade PD ex ante</text><rect x="310" y="310" width="1085" height="111" rx="12" fill="#18382c" stroke="#75d5a4"/><text x="329" y="336" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Referência disponível — composição ilustrativa v2</text><text x="329" y="362" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Fonte/versão, recorte e ciclo compatíveis neste exemplo · pareceres registrados na fixture</text><text x="329" y="388" fill="#e6bd75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="start">Seleção ainda não confirmada · sem admissão normativa</text><rect x="1140" y="345" width="234" height="38" rx="8" fill="#216c4a" stroke="#75d5a4"/><text x="1257" y="369" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Confirmar referência</text><rect x="310" y="432" width="1085" height="92" rx="12" fill="#10201d" stroke="#35584c"/><circle cx="345" cy="466" r="18" fill="#214536" stroke="#35584c"/><text x="345" y="472" fill="#75d5a4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="376" y="461" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">Composição nacional da frota</text><text x="376" y="486" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Denominador e cobertura: ver detalhe autorizado.</text><text x="376" y="508" fill="#75d5a4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">Snapshot preparatório disponível</text><rect x="1140" y="456" width="234" height="38" rx="8" fill="#10201d" stroke="#35584c"/><text x="1257" y="480" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Ver cobertura</text><rect x="310" y="534" width="1085" height="92" rx="12" fill="#10201d" stroke="#35584c"/><circle cx="345" cy="568" r="18" fill="#214536" stroke="#35584c"/><text x="345" y="574" fill="#75d5a4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="376" y="563" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">Eficiência dos veículos elétricos</text><text x="376" y="588" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Ratings vinculados aos modelos, edição e ciclo.</text><text x="376" y="610" fill="#75d5a4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">Referência versionada disponível</text><rect x="1140" y="558" width="234" height="38" rx="8" fill="#10201d" stroke="#35584c"/><text x="1257" y="582" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Ver ratings</text><rect x="310" y="636" width="1085" height="92" rx="12" fill="#10201d" stroke="#35584c"/><circle cx="345" cy="670" r="18" fill="#214536" stroke="#35584c"/><text x="345" y="676" fill="#75d5a4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="376" y="665" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">Veículos convencionais comparáveis</text><text x="376" y="690" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Pares revisados na fixture, sem aprovação normativa.</text><text x="376" y="712" fill="#75d5a4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">Referência versionada disponível</text><rect x="1140" y="660" width="234" height="38" rx="8" fill="#10201d" stroke="#35584c"/><text x="1257" y="684" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Ver comparáveis</text><rect x="310" y="740" width="1085" height="63" rx="12" fill="#10201d" stroke="#35584c"/><text x="328" y="764" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">AFEC e MPG</text><text x="328" y="787" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Exibir apenas se permitidos; ver exemplo didático de cobertura e ponderação.</text><rect x="310" y="823" width="175" height="38" rx="8" fill="#10201d" stroke="#35584c"/><text x="397.5" y="847" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Atualizar dados</text><rect x="497" y="823" width="96" height="38" rx="8" fill="#10201d" stroke="#35584c"/><text x="545" y="847" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Voltar</text><rect x="1171" y="823" width="224" height="38" rx="8" fill="#216c4a" stroke="#75d5a4"/><text x="1283" y="847" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Próxima etapa</text></svg>