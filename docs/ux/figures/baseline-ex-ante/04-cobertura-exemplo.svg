xt-anchor="start">Peso</text><text x="605" y="401" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Rating elétrico</text><text x="850" y="401" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">MPG comparável</text><path d="M78 422 L1105 422" fill="none" stroke="#35584c" stroke-width="1.5"/><text x="80" y="447" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">A</text><text x="280" y="447" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">5.000</text><text x="450" y="447" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">50%</text><text x="605" y="447" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">20</text><text x="850" y="447" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">30</text><path d="M78 469 L1105 469" fill="none" stroke="#35584c" stroke-width="1.5"/><text x="80" y="494" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">B</text><text x="280" y="494" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">3.000</text><text x="450" y="494" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">30%</text><text x="605" y="494" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">25</text><text x="850" y="494" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">25</text><path d="M78 516 L1105 516" fill="none" stroke="#35584c" stroke-width="1.5"/><text x="80" y="541" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">C</text><text x="280" y="541" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">2.000</text><text x="450" y="541" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">20%</text><text x="605" y="541" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">30</text><text x="850" y="541" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">20</text><text x="58" y="633" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">A ponderação é calculada pelo backend, com vetor completo, ciclo e fontes versionados.</text><text x="58" y="665" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Sem cobertura comprovada ou direito de leitura, os pesos e os valores não são exibidos.</text><text x="58" y="702" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">No produto, cada linha também mostra comparável, combustível, fonte, parecer e ressalvas autorizados.</text></svg>