<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="Fluxo plataforma, seleção ex ante, PD e MR"><title>Fluxo plataforma, seleção ex ante, PD e MR</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#75d5a4"/></marker></defs><rect width="1200" height="780" fill="#0b1418"/><text x="40" y="52" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">Da plataforma à linha de base e ao monitoramento</text><text x="40" y="81" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Proposta de arquitetura · VM0038 OPEN BR · referências autorizadas e versionadas</text><rect x="40" y="112" width="1120" height="212" rx="12" fill="#122421" stroke="#35584c"/><text x="64" y="145" fill="#75d5a4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">PLATAFORMA CARBONFLOW</text><text x="64" y="171" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Fontes, classificação, licenças, revisão e snapshots reutilizáveis no escopo autorizado</text><rect x="64" y="191" width="248" height="75" rx="12" fill="#10201d" stroke="#35584c"/><text x="80" y="218" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Senatran / EVR</text><text x="80" y="243" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Estoque, ano, cobertura</text><rect x="332" y="191" width="248" height="75" rx="12" fill="#10201d" stroke="#35584c"/><text x="348" y="218" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Inmetro / PBEV</text><text x="348" y="243" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Ratings e ciclo</text><rect x="600" y="191" width="248" height="75" rx="12" fill="#10201d" stroke="#35584c"/><text x="616" y="218" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Comparáveis</text><text x="616" y="243" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Pares e pareceres</text><rect x="868" y="191" width="248" height="75" rx="12" fill="#10201d" stroke="#35584c"/><text x="884" y="218" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Combustíveis</text><text x="884" y="243" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Fatores e vigência</text><rect x="310" y="279" width="580" height="29" rx="6" fill="#216c4a" stroke="#75d5a4"/><text x="600" y="299" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Referências imutáveis · direitos e status por finalidade</text><path d="M600 325 L600 365" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="250" y="365" width="700" height="156" rx="12" fill="#122421" stroke="#35584c"/><text x="600" y="399" fill="#75d5a4" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">PROJETO · PREPARAÇÃO EX ANTE</text><text x="600" y="430" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Contexto → opções compatíveis → confirmação autorizada</text><text x="600" y="456" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Seleção versionada sem exigir MR ou energia medida</text><text x="600" y="483" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Premissas, fatores, revisão e lacunas</text><path d="M600 521 V550 H290 V575 M600 550 H910 V575" fill="none" stroke="#75d5a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="575" width="500" height="143" rx="12" fill="#122421" stroke="#35584c"/><text x="65" y="610" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">PD · elaboração ex ante</text><text x="65" y="638" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Referências e premissas · estimativa se suportada</text><text x="65" y="665" fill="#75d5a4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Sem MR obrigatório; sem admissão automática</text><rect x="660" y="575" width="500" height="143" rx="12" fill="#122421" stroke="#35584c"/><text x="685" y="610" fill="#e4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">MR · seleção monitorada</text><text x="685" y="638" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Resolver novamente por ano/janela + ED/EC/EFel</text><text x="685" y="665" fill="#75d5a4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">V64 e guardas E8 preservadas</text><text x="40" y="753" fill="#b5cfc3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">PD congelado preserva a versão. MR não herda a referência sem confirmação de compatibilidade.</text></svg>