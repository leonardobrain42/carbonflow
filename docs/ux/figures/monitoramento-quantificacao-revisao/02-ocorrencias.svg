s</text><text x="310" y="87" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Etapa 2 · exemplo de registro contextual, sem ocorrência real</text><rect x="310" y="109" width="265.25" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="442.625" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="400" text-anchor="middle">Instalações e medidores</text><rect x="583.25" y="109" width="265.25" height="40" rx="8" fill="#204b3a" stroke="#75d5a4"/><text x="715.875" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="700" text-anchor="middle">Leituras e ocorrências</text><rect x="856.5" y="109" width="265.25" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="989.125" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="400" text-anchor="middle">QA e evidências</text><rect x="1129.75" y="109" width="265.25" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="1262.375" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="400" text-anchor="middle">Relatório e fator elétrico</text><rect x="310" y="166" width="1085" height="240" rx="9" fill="#10201d" stroke="#35584c"/><text x="328" y="197" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e4f2ed" font-weight="700" text-anchor="start">Registrar ocorrência verificável</text><text x="328" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="600" text-anchor="start">Tipo</text><rect x="328" y="228" width="510" height="31" rx="9" fill="#10201d" stroke="#35584c"/><text x="340" y="249" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="400" text-anchor="start">Indisponibilidade da fonte</text><text x="859" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="600" text-anchor="start">Objeto afetado</text><rect x="859" y="228" width="510" height="31" rx="9" fill="#10201d" stroke="#35584c"/><text x="871" y="249" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="400" text-anchor="start">Selecionar origem autorizada</text><text x="328" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="600" text-anchor="start">Início local</text><rect x="328" y="286" width="510" height="31" rx="9" fill="#10201d" stroke="#35584c"/><text x="340" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="400" text-anchor="start">Selecionar data, hora e fuso</text><text x="859" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="600" text-anchor="start">Fim exclusivo</text><rect x="859" y="286" width="510" height="31" rx="9" fill="#10201d" stroke="#35584c"/><text x="871" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="400" text-anchor="start">Selecionar data, hora e fuso</text><text x="328" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="600" text-anchor="start">Referência do incidente</text><rect x="328" y="344" width="510" height="31" rx="9" fill="#10201d" stroke="#35584c"/><text x="340" y="365" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="400" text-anchor="start">Selecionar prova / informar referência</text><text x="859" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b5cfc3" font-weight="600" text-anchor="start">Descrição e impacto</text><rect x="859" y="344" width="510" height="31" rx="9" fill="#10201d" stroke="#35584c"/><text x="871" y="365" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="400" text-anchor="start">A preencher</text><rect x="1155" y="419" width="220" height="36" rx="7" fill="#216c4a" stroke="#75d5a4"/><text x="1265" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Registrar ocorrência</text><rect x="310" y="470" width="1085" height="100" rx="9" fill="#10201d" stroke="#35584c"/><text x="328" y="497" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e4f2ed" font-weight="700" text-anchor="start">Impacto no QA</text><text x="328" y="522" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Ver janelas, medidores e horas sobrepostas; não fracionar energia.</text><text x="328" y="548" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e6bd75" font-weight="600" text-anchor="start">Aguardando ocorrência</text><rect x="1155" y="499" width="220" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1265" y="522" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Consultar janela</text><rect x="310" y="584" width="1085" height="100" rx="9" fill="#10201d" stroke="#35584c"/><text x="328" y="611" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e4f2ed" font-weight="700" text-anchor="start">Parecer independente</text><text x="328" y="636" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">REV autorizado: confirmar bloqueio ou liberar somente o gate da ocorrência.</text><text x="328" y="662" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e6bd75" font-weight="600" text-anchor="start">Sem parecer registrado</text><rect x="1155" y="613" width="220" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1265" y="636" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Ver histórico</text><text x="310" y="748" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b5cfc3" font-weight="400" text-anchor="start">Liberação não substitui leituras faltantes nem autoriza créditos.</text><rect x="310" y="827" width="175" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="397.5" y="850" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Atualizar dados</text><rect x="497" y="827" width="95" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="544.5" y="850" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Voltar</text><rect x="1170" y="827" width="225" height="36" rx="7" fill="#216c4a" stroke="#75d5a4"/><text x="1282.5" y="850" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Próxima etapa</text></svg>