<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Importação assistida"><title>Importação assistida</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#75d5a4"/></marker></defs><rect width="1440" height="900" fill="#0b1418"/><rect x="18" y="18" width="246" height="864" rx="9" fill="#10201d" stroke="#35584c"/><rect x="284" y="18" width="1138" height="864" rx="9" fill="#122421" stroke="#35584c"/><text x="36" y="52" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#b5cfc3" font-weight="700" text-anchor="start">COMEÇAR</text><text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="600" text-anchor="start">Painel de trabalho</text><text x="40" y="109" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="600" text-anchor="start">Preparar informações</text><text x="36" y="152" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#b5cfc3" font-weight="700" text-anchor="start">APLICABILIDADE</text><text x="40" y="176" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="600" text-anchor="start">Situação do projeto</text><text x="40" y="209" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="600" text-anchor="start">Acesso à rede</text><text x="40" y="242" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="600" text-anchor="start">Direitos do projeto</text><text x="40" y="275" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="600" text-anchor="start">Estações e fronteira</text><text x="36" y="318" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#b5cfc3" font-weight="700" text-anchor="start">FUNDAMENTAÇÃO</text><text x="40" y="342" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="600" text-anchor="start">Linha de base</text><text x="40" y="375" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="600" text-anchor="start">Adicionalidade</text><text x="40" y="408" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="600" text-anchor="start">Quantificação</text><text x="36" y="451" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#b5cfc3" font-weight="700" text-anchor="start">SUSTENTABILIDADE</text><text x="40" y="475" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="600" text-anchor="start">Salvaguardas e riscos</text><text x="40" y="508" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="600" text-anchor="start">Partes interessadas</text><text x="36" y="551" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#b5cfc3" font-weight="700" text-anchor="start">PLANEJAMENTO E OPERAÇÃO</text><text x="40" y="575" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="600" text-anchor="start">Plano de monitoramento</text><rect x="30" y="589" width="220" height="32" rx="7" fill="#204b3a" stroke="#75d5a4"/><text x="40" y="608" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="600" text-anchor="start">Monitorar energia</text><text x="36" y="651" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#b5cfc3" font-weight="700" text-anchor="start">DOCUMENTAÇÃO</text><text x="40" y="675" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="600" text-anchor="start">Redigir</text><text x="40" y="708" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e4f2ed" font-weight="600" text-anchor="start">Revisar</text><text x="310" y="60" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#e4f2ed" font-weight="700" text-anchor="start">Importar medições</text><text x="310" y="87" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Etapa 2 · dados candidatos, não medição admitida</text><rect x="310" y="109" width="265.25" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="442.625" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="400" text-anchor="middle">Instalações e medidores</text><rect x="583.25" y="109" width="265.25" height="40" rx="8" fill="#204b3a" stroke="#75d5a4"/><text x="715.875" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="700" text-anchor="middle">Leituras e ocorrências</text><rect x="856.5" y="109" width="265.25" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="989.125" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="400" text-anchor="middle">QA e evidências</text><rect x="1129.75" y="109" width="265.25" height="40" rx="8" fill="#10201d" stroke="#35584c"/><text x="1262.375" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="400" text-anchor="middle">Relatório e fator elétrico</text><rect x="310" y="166" width="1085" height="100" rx="9" fill="#10201d" stroke="#35584c"/><text x="328" y="193" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e4f2ed" font-weight="700" text-anchor="start">1. Selecionar origem</text><text x="328" y="218" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Sistemas associados a medidores configurados e autorizados.</text><text x="328" y="244" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e6bd75" font-weight="600" text-anchor="start">Nenhuma origem selecionada</text><rect x="1155" y="195" width="220" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1265" y="218" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Selecionar origem</text><rect x="310" y="280" width="1085" height="176" rx="9" fill="#10201d" stroke="#35584c"/><text x="328" y="311" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#e4f2ed" font-weight="700" text-anchor="start">2. Arquivo CSV</text><text x="328" y="341" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Até 2 MB · 2.000 linhas · UTF-8 · intervalos de até uma hora</text><rect x="328" y="364" width="210" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="433" y="387" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Baixar modelo CSV</text><rect x="550" y="364" width="220" height="36" rx="7" fill="#216c4a" stroke="#75d5a4"/><text x="660" y="387" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Selecionar arquivo</text><text x="328" y="430" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Cabeçalhos, timezone, unidades e exemplos didáticos no modelo.</text><rect x="310" y="470" width="1085" height="100" rx="9" fill="#10201d" stroke="#35584c"/><text x="328" y="497" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e4f2ed" font-weight="700" text-anchor="start">3. Validar conteúdo</text><text x="328" y="522" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Configuração, calibração, unidades, intervalo, duplicatas e escopo.</text><text x="328" y="548" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e6bd75" font-weight="600" text-anchor="start">Aguardando arquivo</text><rect x="1155" y="499" width="220" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1265" y="522" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Importar candidato</text><rect x="310" y="584" width="1085" height="100" rx="9" fill="#10201d" stroke="#35584c"/><text x="328" y="611" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e4f2ed" font-weight="700" text-anchor="start">4. Resultado do lote</text><text x="328" y="636" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Linhas candidatas, quarentena, motivos, filtros e correções.</text><text x="328" y="662" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e6bd75" font-weight="600" text-anchor="start">Nenhum lote recebido</text><rect x="1155" y="613" width="220" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1265" y="636" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Consultar lotes</text><text x="310" y="735" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b5cfc3" font-weight="400" text-anchor="start">Original cifrado preservado. Reimportação não apaga versão anterior.</text><rect x="310" y="827" width="175" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="397.5" y="850" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Atualizar dados</text><rect x="497" y="827" width="95" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="544.5" y="850" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Voltar</text><rect x="1170" y="827" width="225" height="36" rx="7" fill="#216c4a" stroke="#75d5a4"/><text x="1282.5" y="850" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Próxima etapa</text></svg>