" stroke="#35584c"/><text x="328" y="613" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e4f2ed" font-weight="700" text-anchor="start">Total anual · indisponível</text><text x="328" y="638" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Consulta não é fechamento normativo; não somar membros históricos como total.</text><text x="328" y="664" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e6bd75" font-weight="600" text-anchor="start">Aguardando cobertura e referências vigentes</text><rect x="1155" y="615" width="220" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="1265" y="638" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Comparar versões</text><text x="310" y="749" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b5cfc3" font-weight="400" text-anchor="start">Reexecução é ação autorizada; histórico permanece intacto.</text><rect x="310" y="827" width="175" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="397.5" y="850" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Atualizar dados</text><rect x="497" y="827" width="95" height="36" rx="7" fill="#10201d" stroke="#35584c"/><text x="544.5" y="850" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Voltar</text><rect x="1170" y="827" width="225" height="36" rx="7" fill="#216c4a" stroke="#75d5a4"/><text x="1282.5" y="850" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e4f2ed" font-weight="600" text-anchor="middle">Próxima etapa</text></svg>