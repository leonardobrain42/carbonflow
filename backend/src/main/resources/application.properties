quarkus.http.host=127.0.0.1
quarkus.http.test-port=0
# A rota de CSV lê o primeiro byte excedente para explicar a recusa no contrato da API.
quarkus.http.limits.max-body-size=10000001
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=${CARBONFLOW_DB_URL:jdbc:postgresql://127.0.0.1:55432/carbonflow}
%test.quarkus.datasource.jdbc.url=${CARBONFLOW_TEST_DB_URL:jdbc:postgresql://127.0.0.1:55432/carbonflow_test}
quarkus.datasource.username=${CARBONFLOW_DB_USER:carbonflow}
quarkus.datasource.password=${CARBONFLOW_DB_PASSWORD:carbonflow}
quarkus.flyway.migrate-at-start=true

# Optional sandbox compliance staff and document storage. Secrets are supplied by the operator.
carbonflow.compliance.staff=${CARBONFLOW_COMPLIANCE_STAFF:}
carbonflow.compliance.document-key=${CARBONFLOW_COMPLIANCE_DOCUMENT_KEY:}
