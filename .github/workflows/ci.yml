name: CarbonFlow CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flyway-guard:
    name: Flyway / versions and published immutability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check versions and base migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/check_flyway_migrations.py "$BASE_SHA"
          else
            python3 scripts/check_flyway_migrations.py
          fi

  angular-build:
    name: Angular / build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  quarkus-tests:
    name: Quarkus / integration tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: carbonflow_test
          POSTGRES_USER: carbonflow
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carbonflow -d carbonflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CARBONFLOW_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/carbonflow_test
      CARBONFLOW_DB_USER: carbonflow
      CARBONFLOW_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend
      - name: Run tests against disposable PostgreSQL
        working-directory: backend
        run: |
          # The ubuntu-24.04 image provides Maven. Always use the local
          # executable in CI: the wrapper may attempt a 3.9.12 zip download
          # and fail before running any tests when Maven Central is flaky.
          # The pinned ./mvnw remains available to developers locally.
          if ! command -v mvn >/dev/null 2>&1; then
            echo "::error::Maven not installed on the configured CI runner."
            exit 1
          fi
          mvn -B -ntp --version
          # Central may occasionally return HTTP 429 before tests start.
          # Retry ONLY repository throttling; do not hide compiler/test failures.
          set -o pipefail
          attempt=1
          while true; do
            if mvn -B -ntp -U clean verify 2>&1 | tee /tmp/carbonflow-maven-run.log; then
              break
            fi
            if [ "$attempt" -ge 3 ] || ! grep -Eiq 'HTTP Status: 429|HTTP 429|status code: 429|Too Many Requests' /tmp/carbonflow-maven-run.log; then
              echo "::error::Maven build/test failure; not a transient Central 429 (or retries exhausted)."
              exit 1
            fi
            echo "::warning::Maven Central rate-limited dependency download; retry $((attempt + 1))/3."
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quarkus-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  browser-e2e:
    name: Angular / browser journeys (isolated Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARBONFLOW_PORT: '18087'
      CARBONFLOW_TEST_URL: http://127.0.0.1:18087
      COMPOSE_PROJECT_NAME: carbonflow-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Install browser matching locked playwright-core
        working-directory: frontend
        run: |
          npx --no-install playwright-core install --with-deps chromium
          echo "CARBONFLOW_CHROME=$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Start isolated disposable application
        run: docker compose up --build --wait -d
      - name: Execute browser journeys sequentially
        working-directory: frontend
        run: |
          set -o pipefail
          node --test --test-concurrency=1 test/*.test.mjs 2>&1 | tee ../browser-e2e.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-journey-results
          path: browser-e2e.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy only the CI Compose environment
        if: always()
        run: docker compose down -v --remove-orphans

  demo-sandbox:
    name: Demo sandbox / provisionamento real de contas
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Deliberately leave CARBONFLOW_PORT unset to test the script's default
      # and catch host-port mismatches during initial provisioning.
      CARBONFLOW_DEMO_PROJECT: carbonflow-demo-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Install browser matching locked playwright-core
        working-directory: frontend
        run: |
          npx --no-install playwright-core install --with-deps chromium
          echo "CARBONFLOW_CHROME=$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Validate local credential and admin MFA safety without Docker
        run: |
          python3 -m unittest discover -s scripts -p 'test_demo_sandbox.py' -v
          python3 -m unittest discover -s scripts -p 'test_admin_sandbox.py' -v
          python3 -m unittest discover -s scripts -p 'test_flyway_v69_compat.py' -v
          python3 -m unittest discover -s scripts -p 'test_demo_flyway_compat.py' -v
          python3 -m unittest discover -s scripts -p 'test_demo_flyway_v79_compat.py' -v
          python3 -m unittest discover -s scripts -p 'test_inspect_senatran_stock_sample.py' -v
      - name: Start isolated sandbox and provision account
        run: python3 scripts/demo_sandbox.py start --quiet
      - name: Add a second account using the real confirmation API
        run: python3 scripts/demo_sandbox.py add-user --email segunda@carbonflow.test --name "Segunda conta demo" --quiet
      - name: Provision local administrative staff using normal account registration
        run: python3 scripts/admin_sandbox.py setup
      - name: Verify accounts and distinct sessions
        run: python3 scripts/demo_sandbox.py smoke
      - name: Verify UX-08 against real Quarkus and PostgreSQL
        working-directory: frontend
        env:
          CARBONFLOW_TEST_URL: http://127.0.0.1:18088
        run: node --test --test-concurrency=1 test/requirements-journey*.integration.mjs
      - name: Rerun provisioning to prove repeatability without resetting passwords
        run: |
          python3 scripts/demo_sandbox.py start --quiet
          python3 scripts/demo_sandbox.py smoke
      - name: Reproduce legacy V71 checksum and late V69.1 on a persisted demo DB
        # Direct Compose calls must publish the same port as demo_sandbox.py.
        # Keep the default-port test for the earlier provisioning steps.
        env:
          CARBONFLOW_PORT: '18088'
        run: |
          set -euo pipefail
          # This is a disposable CI DB. Real user volumes are NEVER modified.
          docker compose -p "$CARBONFLOW_DEMO_PROJECT" -f compose.yaml -f compose.demo.yaml stop app
          docker compose -p "$CARBONFLOW_DEMO_PROJECT" -f compose.yaml -f compose.demo.yaml exec -T db \
            psql -U carbonflow -d carbonflow -v ON_ERROR_STOP=1 -c "
              ALTER TABLE app_open_asset_evidence DROP COLUMN submitted_file_name;
              ALTER TABLE app_open_e8_run DROP COLUMN temporal_context;
              ALTER TABLE app_open_e8_run_command DROP COLUMN request_sha256;
              -- Restore the exact legacy run schema expected by the V71 guard.
              ALTER TABLE app_open_e8_run
                DROP CONSTRAINT app_open_e8_run_reviewed_pins,
                DROP CONSTRAINT app_open_e8_ir_context_shape,
                DROP CONSTRAINT app_open_e8_ir_assessment_fk,
                DROP COLUMN ir_assessment_id,
                DROP COLUMN ir_assessment_sha256,
                DROP COLUMN ir_assessment_version,
                DROP COLUMN ir_context_sha256,
                DROP COLUMN ir_context_state,
                ADD CONSTRAINT app_open_e8_run_reviewed_pins CHECK (
                  state <> 'REVIEWED_INTERNAL' OR
                  (fuel_pin_id IS NOT NULL AND ir_pin_id IS NOT NULL AND dy_pin_id IS NOT NULL));
              ALTER TABLE app_open_ir_assessment DROP CONSTRAINT app_open_ir_run_target;
              DELETE FROM flyway_schema_history WHERE version IN ('69.1','81','92');
              UPDATE flyway_schema_history SET checksum=167374965 WHERE version='71';"
          python3 scripts/demo_flyway_compat.py
          python3 scripts/demo_flyway_compat.py --apply
          # Reuse demo.compose's admin roster and port, avoiding a Compose
          # configuration drift/recreation when the app starts again.
          python3 -c 'import sys; sys.path.insert(0, "scripts"); import demo_sandbox as d; d.compose("up", "-d", "--wait", "app")'
          docker compose -p "$CARBONFLOW_DEMO_PROJECT" -f compose.yaml -f compose.demo.yaml exec -T db \
            psql -U carbonflow -d carbonflow -v ON_ERROR_STOP=1 -c "
              SELECT CASE WHEN
                EXISTS (SELECT 1 FROM flyway_schema_history
                        WHERE version='69.1' AND success)
                AND EXISTS (SELECT 1 FROM flyway_schema_history
                            WHERE version='71' AND checksum=-1979807539 AND success)
                AND EXISTS (SELECT 1 FROM information_schema.columns
                            WHERE table_name='app_open_asset_evidence'
                              AND column_name='submitted_file_name')
                AND EXISTS (SELECT 1 FROM flyway_schema_history WHERE version='92' AND success)
                AND EXISTS (SELECT 1 FROM pg_constraint
                            WHERE conrelid='app_open_e8_run'::regclass AND conname='app_open_e8_ir_assessment_fk' AND convalidated)
                THEN 'UPGRADE_OK' ELSE 'UPGRADE_FAILED' END;" | grep UPGRADE_OK
          # Docker's host forwarding may not rebind after stop/up on the CI runner.
          # The normal first-boot steps already validated real HTTP account logins.
          # Verify the restarted app internally and the ORIGINAL identities/credentials
          # in the SAME PostgreSQL volume, independently of host NAT re-publication.
          python3 -c 'import sys; sys.path.insert(0, "scripts"); import demo_sandbox as d; d.compose("exec", "-T", "app", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health/ready")'
          docker compose -p "$CARBONFLOW_DEMO_PROJECT" -f compose.yaml -f compose.demo.yaml exec -T db \
            psql -U carbonflow -d carbonflow -v ON_ERROR_STOP=1 -c "
              SELECT CASE WHEN count(*)=3 THEN 'ACCOUNTS_PRESERVED'
              ELSE 'ACCOUNTS_MISSING' END
              FROM app_identity i JOIN app_account_credential c ON c.identity_id=i.id
              WHERE i.email_normalized IN
                ('demo@carbonflow.test','segunda@carbonflow.test','admin@carbonflow.test')
                AND i.status='ACTIVE' AND i.email_verified_at IS NOT NULL;" | grep ACCOUNTS_PRESERVED
          # Exercise the REAL post-upgrade login endpoint through the container's
          # loopback, bypassing only CI's host NAT after stop/up. Credentials
          # arrive on curl stdin, never in commands, logs or HTTP URL.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, "scripts")
          import demo_sandbox as demo
          files = sorted(demo.ACCOUNT_DIR.glob("*.json"))
          if len(files) != 3:
              raise RuntimeError("Unexpected demo account count")
          # The application allows only TWO simultaneous account sessions.
          # Log out each account before checking the next one; a third
          # unclosed login would correctly return HTTP 409.
          # The cookie is stored only inside the demo's private tmpfs and
          # removed even if a request fails. Passwords go through stdin.
          session_check = """
          jar="$(mktemp /run/carbonflow-demo-inbox/.ci-login.XXXXXX)"
          chmod 600 "$jar"
          trap 'rm -f "$jar"' EXIT
          login="$(curl -sS -o /dev/null -w '%{http_code}' -c "$jar" \\
                  -H 'Content-Type: application/json' --data-binary @- \\
                  http://127.0.0.1:8080/v1/account-session)"
          if [ "$login" != 204 ]; then
              printf 'LOGIN_HTTP_%s\\n' "$login"
              exit 1
          fi
          logout="$(curl -sS -o /dev/null -w '%{http_code}' -b "$jar" \\
                   -X DELETE http://127.0.0.1:8080/v1/account-session)"
          if [ "$logout" != 204 ]; then
              printf 'LOGOUT_HTTP_%s\\n' "$logout"
              exit 1
          fi
          printf 'SESSION_CLOSED\\n'
          """
          command = [
              "docker", "compose", "-p", demo.PROJECT,
              "-f", str(demo.ROOT/"compose.yaml"),
              "-f", str(demo.ROOT/"compose.demo.yaml"),
              "exec", "-T", "app", "sh", "-ec", session_check
          ]
          for path in files:
              saved=json.loads(path.read_text(encoding="utf-8"))
              result=subprocess.run(
                  command, input=json.dumps({"email":saved["email"],
                                            "password":saved["password"]}),
                  capture_output=True, text=True,
                  env={**os.environ, "CARBONFLOW_PORT":demo.PORT}
              )
              if result.returncode != 0 or result.stdout.strip() != "SESSION_CLOSED":
                  # HTTP status only: never print headers, cookies or passwords.
                  code = result.stdout.strip() or "TRANSPORT_ERROR"
                  raise RuntimeError("Post-upgrade login/logout failed: " + code)
          print("LOGIN_UPGRADE_OK: three original accounts authenticated via container API")
          PY
      - name: Reproduce actual legacy V71 filename collision (no E8 tables)
        env:
          CARBONFLOW_PORT: '18088'
        run: |
          set -euo pipefail
          # This is CI's disposable database ONLY. This models the exact
          # historical script/description/checksum observed in the user's DB.
          # Never drop project tables/columns in a real sandbox.
          python3 -c 'import sys; sys.path.insert(0, "scripts"); import demo_sandbox as d; d.compose("stop", "app")'
          docker compose -p "$CARBONFLOW_DEMO_PROJECT" -f compose.yaml -f compose.demo.yaml exec -T db \
            psql -U carbonflow -d carbonflow -v ON_ERROR_STOP=1 -c "
              BEGIN;
              DROP TABLE app_open_e8_run_timing;
              DROP TABLE app_open_e8_run_command;
              DROP TABLE app_open_e8_run;
              ALTER TABLE app_open_ir_assessment DROP CONSTRAINT app_open_ir_run_target;
              DELETE FROM flyway_schema_history WHERE version IN ('69.1', '78', '79', '80', '81','92');
              UPDATE flyway_schema_history SET
                description='asset evidence submitted filename backfill',
                script='db/migration/V71__asset_evidence_submitted_filename_backfill.sql',
                checksum=167374965
              WHERE version='71';
              COMMIT;"
          # First pass is read-only. --apply reclassifies only the prevalidated
          # filename migration metadata into V69.1, not as the E8 V71.
          python3 scripts/demo_flyway_compat.py
          python3 scripts/demo_flyway_compat.py --apply
          docker compose -p "$CARBONFLOW_DEMO_PROJECT" -f compose.yaml -f compose.demo.yaml exec -T db \
            psql -U carbonflow -d carbonflow -v ON_ERROR_STOP=1 -c "
              SELECT CASE WHEN
                 EXISTS (SELECT 1 FROM flyway_schema_history
                         WHERE version='69.1' AND checksum=1930605372 AND success)
                 AND NOT EXISTS (SELECT 1 FROM flyway_schema_history WHERE version='71')
                 AND to_regclass('public.app_open_e8_run') IS NULL
                 AND to_regclass('public.app_open_e8_run_command') IS NULL
              THEN 'LEGACY_RECLASSIFIED_OK' ELSE 'LEGACY_RECLASSIFIED_FAILED' END;" \
            | grep LEGACY_RECLASSIFIED_OK
          python3 -c 'import sys; sys.path.insert(0, "scripts"); import demo_sandbox as d; d.compose("up", "-d", "--wait", "app")'
          docker compose -p "$CARBONFLOW_DEMO_PROJECT" -f compose.yaml -f compose.demo.yaml exec -T db \
            psql -U carbonflow -d carbonflow -v ON_ERROR_STOP=1 -c "
              SELECT CASE WHEN
                 EXISTS (SELECT 1 FROM flyway_schema_history
                         WHERE version='69.1' AND checksum=1930605372 AND success)
                 AND EXISTS (SELECT 1 FROM flyway_schema_history
                             WHERE version='71' AND checksum=-1979807539 AND success)
                 AND to_regclass('public.app_open_e8_run') IS NOT NULL
                 AND to_regclass('public.app_open_e8_run_command') IS NOT NULL
                 AND to_regclass('public.app_open_e8_run_timing') IS NOT NULL
                 AND (SELECT count(*) FROM flyway_schema_history
                      WHERE version IN ('78', '79','92') AND success)=3
                 AND EXISTS (SELECT 1 FROM pg_constraint
                             WHERE conrelid='app_open_e8_run'::regclass AND conname='app_open_e8_ir_assessment_fk' AND convalidated)
                 AND (SELECT count(*) FROM app_identity i
                      JOIN app_account_credential c ON c.identity_id=i.id
                      WHERE i.status='ACTIVE' AND i.email_verified_at IS NOT NULL
                      AND i.email_normalized IN
                      ('demo@carbonflow.test','segunda@carbonflow.test','admin@carbonflow.test'))=3
              THEN 'LEGACY_UPGRADE_OK' ELSE 'LEGACY_UPGRADE_FAILED' END;" \
            | grep LEGACY_UPGRADE_OK
          python3 -c 'import sys; sys.path.insert(0, "scripts"); import demo_sandbox as d; d.compose("exec", "-T", "app", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health/ready")'
      - name: Reproduce historical V79 Calendar collision on disposable demo
        env:
          CARBONFLOW_PORT: '18088'
        run: |
          set -euo pipefail
          # Only CI's isolated demo: model the legacy schema with the exact
          # Calendar SQL already applied by V81, retaining its actual checksum.
          # Revert V82/V83/V84/V85/V86/V87/V88/V89/V90/V91/V92/V93/V94/V95/V96/V97 as well: the original V79 must be the last migration.
          # The real demo compatibility guard must continue to reject newer history.
          python3 -c 'import sys; sys.path.insert(0,"scripts"); import demo_sandbox as d; d.compose("stop","app")'
          dc=(docker compose -p "$CARBONFLOW_DEMO_PROJECT" -f compose.yaml -f compose.demo.yaml)
          "${dc[@]}" exec -T db psql -U carbonflow -d carbonflow -v ON_ERROR_STOP=1 -c "
            BEGIN;
            ALTER TABLE app_open_e8_run
              DROP CONSTRAINT app_open_e8_run_reviewed_pins,
              DROP CONSTRAINT app_open_e8_ir_context_shape,
              DROP CONSTRAINT app_open_e8_ir_assessment_fk,
              DROP COLUMN ir_assessment_id,
              DROP COLUMN ir_assessment_sha256,
              DROP COLUMN ir_assessment_version,
              DROP COLUMN ir_context_sha256,
              DROP COLUMN ir_context_state,
              ADD CONSTRAINT app_open_e8_run_reviewed_pins CHECK (
                state <> 'REVIEWED_INTERNAL' OR
                (fuel_pin_id IS NOT NULL AND ir_pin_id IS NOT NULL AND dy_pin_id IS NOT NULL));
            DROP TABLE app_open_ir_annual_temporal_evidence;
            DROP TABLE app_open_ir_annual_evidence;
            DROP TABLE app_open_ir_review;
            DROP FUNCTION app_open_ir_ex_ante_review_guard();
            DROP TABLE app_open_ir_ex_ante_plan;
            DROP FUNCTION app_open_ir_initial_review_guard();
            DROP TABLE app_open_ir_assessment;
            DROP TABLE app_open_dy_first_year_context;
            DROP TABLE app_open_dy_allocation;
            DROP TABLE app_open_dy_search_coverage;
            DROP TABLE app_open_dy_source_license;
            DROP TABLE app_open_dy_issuance;
            DROP TABLE app_open_dy_review;
            DROP TABLE app_open_dy_assessment;
            DROP TABLE app_open_e8_run_timing;
            DELETE FROM flyway_schema_history WHERE version IN ('79','80','82','83','84','85','86','87','88','89','90','91','92','93','94','95','96','97');
            UPDATE flyway_schema_history SET version='79',
              script='db/migration/V79__open_e8_run_calendar.sql'
              WHERE version='81' AND checksum=-898586753 AND success;
            COMMIT;"
          # Reset the V80 constraint to its earlier expression (no hourly rows
          # are expected in this provisioning fixture); do not bypass checks.
          python3 - <<'PY' | "${dc[@]}" exec -T db psql -U carbonflow -d carbonflow -v ON_ERROR_STOP=1
          from pathlib import Path
          sql = Path("backend/src/main/resources/db/migration/V80__open_e8_hourly_engine_constraint.sql").read_text()
          print(sql.replace("engine IN ('vm0038-open-grid-arithmetic@1','vm0038-open-grid-arithmetic@2-hourly')", "engine='vm0038-open-grid-arithmetic@1'"))
          PY
          # A non-empty legacy run and its idempotency command exercise actual
          # preserved column values, not merely an empty-table comparison.
          "${dc[@]}" exec -T db psql -U carbonflow -d carbonflow -v ON_ERROR_STOP=1 -c "
            INSERT INTO app_open_e8_run(id,project_id,organization_id,environment,
              period_code,version,input_sha256,state,gate_codes,created_by,temporal_context)
            SELECT 'f7900000-0000-4000-8000-000000000001',p.id,p.organization_id,p.environment,
              'CI-V79-LEGACY',1,decode(repeat('ab',32),'hex'),'BLOCKED',
              ARRAY['LEGACY_CI'],i.id,jsonb_build_object('fixture','historical calendar')
            FROM app_project p CROSS JOIN app_identity i
            WHERE p.environment='SANDBOX' AND i.email_normalized='demo@carbonflow.test'
            ORDER BY p.id LIMIT 1;
            INSERT INTO app_open_e8_run_command(actor_id,command_key,project_id,run_id,fingerprint,request_sha256)
            SELECT created_by,'ci-v79-legacy-command',project_id,id,decode(repeat('cd',32),'hex'),
              decode(repeat('ef',32),'hex') FROM app_open_e8_run
            WHERE id='f7900000-0000-4000-8000-000000000001';
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM app_open_e8_run_command
                              WHERE command_key='ci-v79-legacy-command') THEN
                RAISE EXCEPTION 'Missing historical fixture';
              END IF;
            END \$\$;"
          snapshot() {
            "${dc[@]}" exec -T db psql -U carbonflow -d carbonflow -At -v ON_ERROR_STOP=1 -c "
              SELECT md5(coalesce((SELECT jsonb_agg(to_jsonb(r) - ARRAY['ir_assessment_id','ir_assessment_sha256','ir_assessment_version','ir_context_sha256','ir_context_state'] ORDER BY id)::text FROM app_open_e8_run r),'')) ||
                     md5(coalesce((SELECT jsonb_agg(to_jsonb(c) ORDER BY actor_id,command_key)::text FROM app_open_e8_run_command c),''));"
          }
          before="$(snapshot)"
          umask 077
          dump="$(mktemp .carbonflow-demo/ci-v79.XXXXXX.dump)"
          "${dc[@]}" exec -T db pg_dump -U carbonflow -d carbonflow -Fc > "$dump"
          python3 scripts/demo_flyway_v79_compat.py | grep 'LEGACY'
          python3 scripts/demo_flyway_v79_compat.py --apply --backup "$dump"
          python3 scripts/demo_flyway_v79_compat.py | grep 'PENDING'
          python3 -c 'import sys; sys.path.insert(0,"scripts"); import demo_sandbox as d; d.compose("up","-d","--wait","app")'
          python3 scripts/demo_flyway_v79_compat.py | grep 'COMPLETE'
          test "$before" = "$(snapshot)"
          "${dc[@]}" exec -T db psql -U carbonflow -d carbonflow -At -v ON_ERROR_STOP=1 -c "
            SELECT CASE WHEN
              (SELECT count(*) FROM flyway_schema_history WHERE success AND
                ((version='79' AND checksum=1403819066) OR
                 (version='80' AND checksum=1264111112) OR
                 (version='81' AND checksum=-898586753)))=3
              AND to_regclass('public.app_open_e8_run_timing') IS NOT NULL
              AND to_regclass('public.app_open_dy_assessment') IS NOT NULL
              AND to_regclass('public.app_open_dy_review') IS NOT NULL
              AND to_regclass('public.app_open_dy_issuance') IS NOT NULL
              AND to_regclass('public.app_open_dy_source_license') IS NOT NULL
              AND to_regclass('public.app_open_dy_search_coverage') IS NOT NULL
              AND to_regclass('public.app_open_dy_allocation') IS NOT NULL
              AND to_regclass('public.app_open_dy_first_year_context') IS NOT NULL
              AND to_regclass('public.app_open_ir_assessment') IS NOT NULL
              AND to_regclass('public.app_open_ir_review') IS NOT NULL
              AND to_regclass('public.app_open_ir_annual_evidence') IS NOT NULL
              AND (SELECT count(*) FROM flyway_schema_history WHERE version IN ('82','83','84','85','86','87','88','89','90','91','92','93','94','95','96','97') AND success)=16
              AND to_regclass('public.app_open_ir_annual_temporal_evidence') IS NOT NULL
              AND EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid='app_open_ir_review'::regclass AND conname='app_open_ir_ex_ante_review_fk' AND convalidated)
              AND to_regclass('public.app_open_ir_ex_ante_plan') IS NOT NULL
              AND EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid='app_open_ir_review'::regclass AND conname='app_open_ir_initial_plan_shape' AND convalidated)
              AND (SELECT count(*) FROM app_identity i JOIN app_account_credential c ON c.identity_id=i.id
                   WHERE i.status='ACTIVE' AND i.email_normalized IN
                   ('demo@carbonflow.test','segunda@carbonflow.test','admin@carbonflow.test'))=3
              THEN 'V79_UPGRADE_OK' ELSE 'V79_UPGRADE_FAILED' END;" | grep V79_UPGRADE_OK
          python3 -c 'import sys; sys.path.insert(0,"scripts"); import demo_sandbox as d; d.compose("exec","-T","app","curl","-fsS","-o","/dev/null","http://127.0.0.1:8080/health/ready")'
          rm -f "$dump"
      - name: Destroy only the disposable demo environment
        if: always()
        run: |
          docker compose -p "$CARBONFLOW_DEMO_PROJECT" -f compose.yaml -f compose.demo.yaml down -v --remove-orphans
          rm -rf .carbonflow-demo
